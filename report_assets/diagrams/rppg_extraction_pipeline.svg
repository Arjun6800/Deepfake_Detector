   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(124.311094 122.052037)">Forehead and both image-side cheeks · ROI-average RGB</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(99.118828 133.302037)">Record timestamps, motion, brightness and observation provenance</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18668b" x="253.8" y="180.750527" transform="rotate(-0 253.8 180.750527)">Synchronize each window to the frame grid</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(120.754687 201.540037)">Preserve missing observations and provenance boundaries</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(114.731719 212.790037)">Reference and enhanced variants use their own support rules</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b65325" x="128.4228" y="265.643711" transform="rotate(-0 128.4228 265.643711)">Project pulse traces</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(66.826941 290.842312)">POS reference and variants</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(48.15405 301.220438)">CHROM and GREEN quality controls</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #367d65" x="379.1772" y="265.643711" transform="rotate(-0 379.1772 265.643711)">Assess observation support</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(318.675403 289.970438)">Coverage, contiguous runs</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(315.465637 301.220438)">and availability of estimates</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #744d98" x="253.8" y="355.624127" transform="rotate(-0 253.8 355.624127)">Condition and aggregate signals</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(138.427031 376.413637)">Detrend / band-limit where specified by the variant</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(142.076953 387.663637)">Combine standardized supported regional signals</text>
   </g>
   <g id="text_11">
