   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #233c50" x="253.8" y="110.008237" transform="rotate(-0 253.8 110.008237)">Track the target face and accept valid landmark observations</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #367d65" x="253.8" y="161.849663" transform="rotate(-0 253.8 161.849663)">Extract selected blendshapes</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(131.215781 179.486437)">30 channels from brows, eyes, cheeks, jaw and mouth</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(114.669844 190.736437)">Carry frame-level availability to the common analysis window</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #367d65" x="133.245" y="247.344191" transform="rotate(-0 133.245 247.344191)">Channel statistics</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(86.879531 269.284584)">Coverage, mean, SD</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(60.663516 280.614037)">Rolling SD and absolute velocity</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #367d65" x="374.355" y="247.344191" transform="rotate(-0 374.355 247.344191)">12 bilateral pairs</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(311.880234 269.364037)">Paired coverage and signed</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(297.204609 280.614037)">and absolute left–right differences</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #744d98" x="253.8" y="338.091839" transform="rotate(-0 253.8 338.091839)">187 window fields</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(109.826016 357.189638)">1 global availability + 30 × 5 channel fields + 12 × 3 pair fields</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #233c50" transform="translate(136.144687 368.474794)">Join with rPPG on the verified video/window timeline</text>
